[project]
name = "supersession-without-erasure"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.6,<2", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "tqdm>=4.67,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
model = ["torch>=2.6", "transformers>=4.50", "accelerate>=1", "bitsandbytes>=0.50,<1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
