  value_allocation: four distinct historical/current assignment values plus two distinct
    replacement identities outside all four assignments
  freshness_policy: fixed prior-history exclusion ledger; structural rejection within
    fixed seeded streams in validation/development/gate/confirmation priority; no
    seed retries or outcome-based exclusions
  order_factors:
  - historical_entity_or_unassigned_mention_order
  - current_entity_order
  live_order_policy: one historical/live assignment block; current-order labels are
    duplicate nuisance variants, not a physical second block
  pair_direction: 0 baseline; 1 edited; independent x and z interventions; no activation
    transfers or reciprocal swaps
  rows_per_history: 192
  surfaces: lower/title x zero/one leading ASCII space; exclude unspaced prefix-changing
    forms; deduplicate token events
  candidate_score: bounded surface-class continuation mass; logsumexp of sequence
    log probabilities; no termination
  development_policy: competence/implementation only; no causal report or prompt/vocabulary
    redevelopment
  span_policy: patch all tokens; require exact pair alignment outside edited span
  surface_geometry_audit: mandatory per-value event count, every event length and
    represented strings; unequal classes visible, not rejected
  primary_contrasts:
  - R_superseded - R_early_unassigned
  - R_superseded - R_entity_mention
  - R_superseded - R_other_attribute
  other_attribute_label: different_relation_control; team/project relations are counterbalanced,
    not claimed unrelated
  secondary:
  - R_superseded - R_late_unassigned
  - R_live - R_superseded
  - live-minus-each-control
  - aligned-versus-reversed historical/current order
  aggregation: mean E over four order cells within each history/condition/edit/query
    before symmetric relevance; aligned/reversed subsets each average their two cells;
    contrasts and bootstrap on histories
  confirmation_policy: all trials; primary estimates never conditioned on correctness
  bootstrap:
    unit: history
    draws: 2000
    seed: 73021
